<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Lodha</title>
  <desc id="desc">Software, systems, and a little hardware. Industrial Engineering and Management at RV College of Engineering, Bengaluru. Batch of 2028. A softly animated blue, teal, and lavender gradient.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b2e"/>
      <stop offset="0.55" stop-color="#26354b"/>
      <stop offset="1" stop-color="#45415f"/>
    </linearGradient>
    <linearGradient id="tide" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#163e47"/>
      <stop offset="0.5" stop-color="#243c53"/>
      <stop offset="1" stop-color="#6b5b87"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b4dcd8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c6c0ed" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#b4dcd8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .tide { opacity: .5; animation: breathe 12s ease-in-out infinite; }
      .dot { opacity: .8; animation: pulse 4s ease-in-out infinite; }
      .sheen { animation: drift 10s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .15; } 50% { opacity: .95; } }
      @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes drift { 0% { transform: translateX(-380px); } 100% { transform: translateX(1200px); } }
      @media (prefers-reduced-motion: reduce) { .tide,.dot,.sheen { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#base)"/>
    <rect class="tide" width="1200" height="320" fill="url(#tide)"/>
    <circle class="dot" cx="963" cy="47" r="4" fill="#beded7"/>
    <text x="980" y="52" font-size="15" fill="#d2dbe7">building &amp; learning</text>
    <text x="64" y="133" font-size="66" font-weight="600" letter-spacing="-2" fill="#f6f7fb">Aryan Lodha</text>
    <text x="67" y="177" font-size="24" fill="#d5deee">Software · Systems · A little hardware</text>
    <text x="67" y="242" font-size="19" fill="#ced6e3">RV College of Engineering · Batch of 2028</text>
    <text x="67" y="272" font-size="16" fill="#b7c5d8">Industrial Engineering &amp; Management · Bengaluru</text>
    <rect x="0" y="318" width="1200" height="2" fill="#c6c0ed" opacity=".12"/>
    <rect class="sheen" x="0" y="318" width="380" height="2" fill="url(#line)"/>
  </g>
</svg>
